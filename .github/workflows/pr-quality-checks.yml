name: PR Fast Quality Checks

on:
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  quality-checks:
    name: Code Quality and Security Gates
    runs-on: ubuntu-latest

    steps:
      # =========================================================================
      # BASE SETUP
      # =========================================================================
      # 1. Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================================
      # CHECKS 1 & 2: PR METADATA VALIDATION (100% Secure from Script Injection)
      # =========================================================================
      # Checks 1 & 2. Validate JIRA SCST Number and RC Labels in PR
      - name: Validate PR Metadata (Branch, Title & RC Labels)
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          python -c '
          import re
          import json
          import os
          import sys

          # Securely pull variables from the system environment
          branch_name = os.environ.get("BRANCH_NAME", "")
          pr_title = os.environ.get("PR_TITLE", "")
          labels_json = os.environ.get("PR_LABELS", "[]")
          regex = r"SCST-[0-9]+" # Matches SCST- followed by digits anywhere in the text

          print(f"Checking Branch Name: {branch_name}")
          if not re.search(regex, branch_name):
              print("::error::CRITICAL ERROR: Branch name is invalid. It must contain a ticket number matching \"SCST-<number>\" (e.g., SCST-1234).")
              sys.exit(1)

          print(f"Checking PR Title: {pr_title}")
          if not re.search(regex, pr_title):
              print("::error::CRITICAL ERROR: PR Title is invalid. It must contain a ticket number matching \"SCST-<number>\" (e.g., SCST-1234).")
              sys.exit(1)

          labels = json.loads(labels_json)
          has_rc_label = any(re.match(r"^RC[0-9]+$", label["name"], re.IGNORECASE) for label in labels)

          print(f"Validating PR Labels: {[l[\"name\"] for l in labels]}")
          if not has_rc_label:
              print("::error::CRITICAL ERROR: PR must have at least one release candidate label matching prefix \"RC\" followed by digits (e.g., RC92, RC01).")
              sys.exit(1)

          print("SUCCESS: PR Metadata validated successfully!")
          '

      # =========================================================================
      # RUNNER ENVIRONMENT SETUP
      # =========================================================================
      # 2. Set up JDK with Maven Caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Detect Changed Java Files
      - name: Get Changed Java Files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            **/*.java

      # =========================================================================
      # CHECKS 3 & 4: SPELLING AND SECRETS
      # =========================================================================
      # Check 3. Spelling Mistakes in New Code (using codespell via python pip)
      - name: Scan for Spelling Mistakes
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          pip install codespell
          codespell ${{ steps.changed-files.outputs.all_changed_files }}


      # =========================================================================
      # QUALITY GATES, TESTING, & DEPENDENCY SCANNING
      # =========================================================================
      # 4. Format changed files relative paths for Checkstyle
      - name: Format Files for Checkstyle
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          CHANGED_LIST="${{ steps.changed-files.outputs.all_changed_files }}"
          FORMATTED_LIST=$(echo "$CHANGED_LIST" | sed 's|src/main/java/||g' | sed 's|src/test/java/||g' | tr ' ' ',')
          echo "CHECKSTYLE_INCLUDES=$FORMATTED_LIST" >> $GITHUB_ENV
          echo "Detected changed files for scanning: $FORMATTED_LIST"

      # 5. Restore PMD Cache
      - name: Restore PMD Cache
        uses: actions/cache@v4
        with:
          path: .pmdCache
          key: ${{ runner.os }}-pmd-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pmd-

      # 6. Run Fast Tests, Dependency Scan, and Quality Gates
      # This single command compiles, runs Unit/Integration tests, scans Checkstyle, 
      # PMD, SpotBugs, and OWASP Dependency-Check natively.
      - name: Run Build and Quality Gates
        run: |
          CHECKSTYLE_OPTS=""
          if [ "${{ steps.changed-files.outputs.any_changed }}" = "true" ]; then
            CHECKSTYLE_OPTS="-Dcheckstyle.includes=${{ env.CHECKSTYLE_INCLUDES }}"
          else
            CHECKSTYLE_OPTS="-Dcheckstyle.skip=true"
          fi

          mvn -f pom-ci.xml clean verify --no-transfer-progress \
            $CHECKSTYLE_OPTS \
            -Dpmd.incrementalAnalysis=true \
            -Dpmd.cacheFile=$(pwd)/.pmdCache \
            -Dspotbugs.failOnError=true \
            -T 1C

      # 7. Generate Quality Gate Summary (XML results to GHA Step Summary)
      - name: Generate Quality Gate Summary
        if: always() # Run even if previous steps failed so we can parse errors
        run: |
          python -c '
          import xml.etree.ElementTree as ET
          import os

          summary_content = "## 🔍 Code Quality Gate Summary\n\n"

          # 1. Parse Checkstyle
          if os.path.exists("target/checkstyle-result.xml"):
              tree = ET.parse("target/checkstyle-result.xml")
              root = tree.getroot()
              violations = []
              for file in root.findall("file"):
                  filename = os.path.basename(file.get("name"))
                  for error in file.findall("error"):
                      violations.append((filename, error.get("line"), error.get("message")))
              if violations:
                  summary_content += "### 🎨 Checkstyle Violations\n\n"
                  summary_content += "| File | Line | Message |\n"
                  summary_content += "| --- | --- | --- |\n"
                  for filename, line, msg in violations:
                      summary_content += f"| {filename} | {line} | {msg} |\n"
                  summary_content += "\n"

          # 2. Parse PMD
          if os.path.exists("target/pmd.xml"):
              tree = ET.parse("target/pmd.xml")
              root = tree.getroot()
              violations = []
              # Handle PMD namespace
              ns = {"pmd": "http://pmd.sourceforge.net/ruleset/2.0.0"}
              for file in root.findall(".//pmd:file", ns):
                  filename = os.path.basename(file.get("name"))
                  for violation in file.findall("pmd:violation", ns):
                      violations.append((filename, violation.get("beginline"), violation.get("rule"), violation.text.strip()))
              if violations:
                  summary_content += "### ⚠️ PMD Violations\n\n"
                  summary_content += "| File | Line | Rule | Message |\n"
                  summary_content += "| --- | --- | --- | --- |\n"
                  for filename, line, rule, msg in violations:
                      summary_content += f"| {filename} | {line} | {rule} | {msg} |\n"
                  summary_content += "\n"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary_content)
          '
