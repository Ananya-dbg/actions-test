name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - master

jobs:
  quality-checks:
    name: Code Quality and Security Gates
    runs-on: ubuntu-latest

    steps:
      # =========================================================================
      # BASE SETUP
      # =========================================================================
      # 1. Checkout the code (fetch-depth: 0 is required to calculate changed files)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================================
      # CHECKS 1 & 2: PR METADATA VALIDATION (Secured with Env Vars & Heredoc)
      # =========================================================================
      # Checks 1 & 2. Validate JIRA SCST Number and RC Labels in PR
      - name: Validate PR Metadata (Branch, Title & RC Labels)
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          python << 'EOF'
          import re
          import json
          import os
          import sys

          # Python securely reads the variables from the OS Environment
          branch_name = os.environ.get("BRANCH_NAME", "")
          pr_title = os.environ.get("PR_TITLE", "")
          labels_json = os.environ.get("PR_LABELS", "[]")
          regex = r"SCST-[0-9]+"

          print(f"Checking Branch Name: {branch_name}")
          if not re.search(regex, branch_name):
              print("::error::CRITICAL: Branch name is invalid. It must contain a ticket number matching 'SCST-<number>' (e.g., SCST-1234).")
              sys.exit(1)

          print(f"Checking PR Title: {pr_title}")
          if not re.search(regex, pr_title):
              print("::error::CRITICAL: PR Title is invalid. It must contain a ticket number matching 'SCST-<number>' (e.g., SCST-1234).")
              sys.exit(1)

          labels = json.loads(labels_json)
          has_rc_label = any(re.match(r"^RC[0-9]+$", label["name"], re.IGNORECASE) for label in labels)

          print(f"Validating PR Labels: {[l['name'] for l in labels]}")
          if not has_rc_label:
              print("::error::CRITICAL: PR must have at least one release candidate label matching prefix 'RC' followed by digits (e.g., RC92, RC01).")
              sys.exit(1)

          print("SUCCESS: PR Metadata validated successfully!")
          EOF

      # =========================================================================
      # RUNNER DEPENDENCY SETUP
      # =========================================================================
      # 2. Set up JDK with Maven Caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Detect Changed Java Files
      - name: Get Changed Java Files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            **/*.java


      # =========================================================================
      # QUALITY GATES, TESTING, & DEPENDENCY SCANNING
      # =========================================================================
      # 4. Format changed files relative paths for Checkstyle
      - name: Format Files for Checkstyle
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          CHANGED_LIST="${{ steps.changed-files.outputs.all_changed_files }}"
          FORMATTED_LIST=$(echo "$CHANGED_LIST" | sed 's|src/main/java/||g' | sed 's|src/test/java/||g' | tr ' ' ',')
          echo "CHECKSTYLE_INCLUDES=$FORMATTED_LIST" >> $GITHUB_ENV
          echo "Detected changed files for scanning: $FORMATTED_LIST"

      # 5. Restore PMD Cache
      - name: Restore PMD Cache
        uses: actions/cache@v4
        with:
          path: .pmdCache
          key: ${{ runner.os }}-pmd-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pmd-

      # 6. Run Fast Tests, Dependency Scan, and Quality Gates
      # This single command compiles, runs Unit/Integration tests, scans Checkstyle, 
      # PMD, SpotBugs, and OWASP Dependency-Check natively.
      - name: Run Build and Quality Gates
        run: |
          CHECKSTYLE_OPTS=""
          if [ "${{ steps.changed-files.outputs.any_changed }}" = "true" ]; then
            CHECKSTYLE_OPTS="-Dcheckstyle.includes=${{ env.CHECKSTYLE_INCLUDES }}"
          else
            CHECKSTYLE_OPTS="-Dcheckstyle.skip=true"
          fi

           # set -o pipefail ensures that if Maven fails, the GHA step correctly fails (even when using tee)
          set -o pipefail

          mvn -f pom-ci.xml clean verify --no-transfer-progress \
            $CHECKSTYLE_OPTS \
            -Dpmd.incrementalAnalysis=true \
            -Dpmd.cacheFile=$(pwd)/.pmdCache \
            -Dspotbugs.failOnError=true \
            -T 1C

      # =========================================================================
      # 7. FUTURE-PROOF SUMMARY: Handle both Metadata and Build Failures
      # =========================================================================
      - name: Generate Quality Gate Summary
        if: failure() # Runs if ANY step in the pipeline fails
        run: |
          echo "## ❌ Quality Gate Failure Summary" >> $GITHUB_STEP_SUMMARY
          
          # CASE 1: The failure happened during the Maven compiling/scanning phase
          if [ -f maven-build.log ]; then
            echo "The build failed during the testing or quality scan checks. Here is the list of errors found:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            
            # Extracts both [ERROR] lines and generic Error prefixes
            grep -E "\[ERROR\]|Error:" maven-build.log >> $GITHUB_STEP_SUMMARY || true
            
            echo '```' >> $GITHUB_STEP_SUMMARY
          
          # CASE 2: The failure happened early (JIRA ticket, Branch, or PR Label violation)
          else
            echo "### ⚠️ PR Metadata Blocked" >> $GITHUB_STEP_SUMMARY
            echo "The pipeline was blocked **before** compiling the code because the Pull Request metadata is invalid." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**How to fix:**" >> $GITHUB_STEP_SUMMARY
            echo "1. Ensure the branch name and PR title contain the ticket number matching \`SCST-<number>\` (e.g., \`SCST-1234\`)." >> $GITHUB_STEP_SUMMARY
            echo "2. Ensure a release candidate label (e.g., \`RC92\`) has been added to the Pull Request." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "*(The exact error is highlighted in red at the very top of this Pull Request page!)*" >> $GITHUB_STEP_SUMMARY
          fi
